name: Update lines & ratings

on:
  schedule:
    - cron: "17 14,23 * * *"   # twice a day, ~10:17 AM and 7:17 PM Eastern; off the hour because GitHub drops on-the-hour crons under load
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull moneylines & spreads (The Odds API)
        run: node scripts/fetch-odds.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Fit power ratings from market spreads
        run: node scripts/fit-ratings.mjs
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/ratings.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update lines & ratings"
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml
